x-https-django: &https-django
  DJANGO_SETTINGS_MODULE: sd_lab_https
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  SSL_CERT_FILE: /etc/sd-lab/ca-bundle.crt
  REQUESTS_CA_BUNDLE: /etc/sd-lab/ca-bundle.crt

services:
  db:
    platform: ${SD_LAB_POSTGIS_PLATFORM:?Run bootstrap/setup-ubuntu.sh}
  init-postgis:
    platform: ${SD_LAB_POSTGIS_PLATFORM:?Run bootstrap/setup-ubuntu.sh}
  django:
    environment: *https-django
    volumes:
      - ./bootstrap/django-https.py:/usr/src/geonode/sd_lab_https.py:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/sd-lab/ca-bundle.crt:ro
  celery:
    environment: *https-django
    volumes:
      - ./bootstrap/django-https.py:/usr/src/geonode/sd_lab_https.py:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/sd-lab/ca-bundle.crt:ro
  geonode:
    volumes:
      - ./bootstrap/geonode-nginx.conf:/etc/nginx/conf.d/default.conf:ro
  geoserver:
    environment:
      PROXY_BASE_URL: ${SD_LAB_ORIGIN:?Run bootstrap/setup-ubuntu.sh}/geoserver
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/etc/sd-lab/cacerts
    volumes:
      - /etc/ssl/certs/java/cacerts:/etc/sd-lab/cacerts:ro
  rustfs:
    environment:
      RUSTFS_BROWSER_REDIRECT_URL: https://rustfs.${SD_LAB_HOST}
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${SD_LAB_HOST}/
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
