name: spatial-data-lab

x-geonode-volumes: &geonode-volumes
  - geonode-statics:/mnt/volumes/statics
  - geoserver-data:/geoserver_data/data
  - geonode-data:/data
  - backups:/backup_restore
  - geonode-tmp:/tmp

x-django: &django
  image: geonode/geonode:5.1.1
  platform: linux/amd64
  restart: unless-stopped
  env_file: config/geonode/common.env
  volumes: *geonode-volumes
  entrypoint:
    - /bin/bash
    - -ec
    - |
      entrypoint=$$(mktemp /tmp/geonode-entrypoint.XXXXXX)
      sed '/^echo POSTGRES_PASSWORD=/d; /^echo DATABASE_URL=/d; /^echo GEODATABASE_URL=/d' /usr/src/geonode/entrypoint.sh > "$$entrypoint"
      exec /bin/bash "$$entrypoint" "$$@"
    - --
  logging:
    driver: local
  environment: &django-env
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
    GEONODE_DATABASE_PASSWORD: ${GEONODE_DATABASE_PASSWORD:?Configure .env}
    GEONODE_GEODATABASE_PASSWORD: ${GEONODE_GEODATABASE_PASSWORD:?Configure .env}
    DATABASE_URL: postgis://geonode:${GEONODE_DATABASE_PASSWORD}@db:5432/geonode
    CELERY_RESULT_BACKEND: db+postgresql://geonode:${GEONODE_DATABASE_PASSWORD}@db:5432/geonode
    GEODATABASE_URL: postgis://geonode_data:${GEONODE_GEODATABASE_PASSWORD}@db:5432/geonode_data
    ADMIN_PASSWORD: ${GEONODE_ADMIN_PASSWORD:?Configure .env}
    GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?Configure .env}
    SECRET_KEY: ${SECRET_KEY:?Configure .env}
    OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:?Configure .env}
    OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:?Configure .env}

services:
  db:
    image: &postgis-image kartoza/postgis:18.6-3.7.0--v2026.11.06
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASS: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,hstore
    volumes:
      - postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASS psql -h 127.0.0.1 -U postgres -d postgres -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  init-postgis:
    image: *postgis-image
    platform: linux/arm64
    entrypoint: ["/bin/sh", "/scripts/init-postgis.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEONODE_DATABASE_PASSWORD: ${GEONODE_DATABASE_PASSWORD}
      GEONODE_GEODATABASE_PASSWORD: ${GEONODE_GEODATABASE_PASSWORD}
    volumes:
      - ./scripts/init-postgis.sh:/scripts/init-postgis.sh:ro
    depends_on:
      db:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    hostname: rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq/90-celery.conf:/etc/rabbitmq/conf.d/90-celery.conf:ro
  django:
    <<: *django
    environment:
      <<: *django-env
      IS_CELERY: "False"
    command: ["uwsgi", "--ini", "/etc/geonode-uwsgi.ini"]
    volumes:
      - geonode-statics:/mnt/volumes/statics
      - geoserver-data:/geoserver_data/data
      - geonode-data:/data
      - backups:/backup_restore
      - geonode-tmp:/tmp
      - ./config/geonode/uwsgi.ini:/etc/geonode-uwsgi.ini:ro
    depends_on:
      init-postgis:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://django:8000/"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
  celery:
    <<: *django
    environment:
      <<: *django-env
      IS_CELERY: "True"
    command: ["celery-cmd"]
    depends_on:
      django:
        condition: service_healthy
  geoserver-data:
    image: geonode/geoserver_data:2.28.6-latest
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-ec"]
    command: ["test -s /geoserver_data/data/global.xml"]
    volumes:
      - geoserver-data:/geoserver_data/data
  geoserver:
    image: geonode/geoserver:2.28.6-latest
    platform: linux/amd64
    restart: unless-stopped
    command:
      - /bin/bash
      - -ec
      - |
        entrypoint=$$(mktemp /tmp/geoserver-entrypoint.XXXXXX)
        sed '/echo "GEONODE_GEODATABASE_PASSWORD is defined/d' /usr/local/tomcat/tmp/entrypoint.sh > "$$entrypoint"
        exec /bin/bash "$$entrypoint"
    env_file: config/geonode/common.env
    environment:
      GEONODE_GEODATABASE_PASSWORD: ${GEONODE_GEODATABASE_PASSWORD}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
    volumes: *geonode-volumes
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS --user "$$GEOSERVER_ADMIN_USER:$$GEOSERVER_ADMIN_PASSWORD" http://127.0.0.1:8080/geoserver/rest/settings.json -o /dev/null']
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 45s
    depends_on:
      geoserver-data:
        condition: service_completed_successfully
      django:
        condition: service_healthy
  geonode:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./config/geonode/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - geonode-statics:/mnt/volumes/statics:ro
    depends_on:
      - django
      - geoserver

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Configure .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Configure .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
  init-buckets:
    image: amazon/aws-cli:2.39.6
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment: &s3-env
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./scripts/init-buckets.sh:/scripts/init-buckets.sh:ro
    depends_on:
      rustfs:
        condition: service_healthy
  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    command: ["--config", "/etc/martin.yaml"]
    environment:
      <<: *s3-env
      MARTIN_DATABASE_URL: postgresql://geonode_data:${GEONODE_GEODATABASE_PASSWORD}@db:5432/geonode_data
    volumes:
      - ./config/martin.yaml:/etc/martin.yaml:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      init-postgis:
        condition: service_completed_successfully
      init-buckets:
        condition: service_completed_successfully
  titiler:
    image: ghcr.io/developmentseed/titiler:2.4.0
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    restart: unless-stopped
    environment:
      <<: *s3-env
      AWS_S3_ENDPOINT: rustfs:9000
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      init-buckets:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./config/monitoring/blackbox.yaml:/etc/blackbox_exporter/config.yml:ro
  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./config/monitoring/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/monitoring/loki.yaml:/etc/loki/local.yaml:ro
      - loki-data:/loki
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Configure .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/monitoring/grafana/overview.json:/etc/grafana/local-dashboards/overview.json:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgis-data:
  rabbitmq-data:
  geoserver-data:
  geonode-statics:
  geonode-data:
  backups:
  geonode-tmp:
  rustfs-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
